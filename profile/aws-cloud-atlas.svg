<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc">
  <title id="title">AWS logo assembled from GitHub contribution cells</title>
  <desc id="desc">A contribution graph animates like puzzle pieces, forming the AWS wordmark and orange smile.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117" />
      <stop offset="0.55" stop-color="#111827" />
      <stop offset="1" stop-color="#0b1220" />
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0" />
      <stop offset="0.5" stop-color="#58a6ff" stop-opacity="0.8" />
      <stop offset="1" stop-color="#ff9900" stop-opacity="0" />
    </linearGradient>
    <filter id="soft-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <g id="week" fill="#21262d">
      <rect y="0" width="14" height="14" rx="3" />
      <rect y="21" width="14" height="14" rx="3" />
      <rect y="42" width="14" height="14" rx="3" />
      <rect y="63" width="14" height="14" rx="3" />
      <rect y="84" width="14" height="14" rx="3" />
      <rect y="105" width="14" height="14" rx="3" />
      <rect y="126" width="14" height="14" rx="3" />
    </g>
    <style>
      .piece {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        animation: assemble .82s cubic-bezier(.16,1,.3,1) forwards;
        animation-delay: var(--delay);
      }
      .entry-0 { transform: translate(-88px,-46px) rotate(-110deg) scale(.12); }
      .entry-1 { transform: translate(76px,-54px) rotate(95deg) scale(.12); }
      .entry-2 { transform: translate(-64px,58px) rotate(120deg) scale(.12); }
      .entry-3 { transform: translate(82px,52px) rotate(-100deg) scale(.12); }
      .cell-blue { fill:#58a6ff; }
      .cell-light { fill:#9ecbff; }
      .cell-white { fill:#f0f6fc; }
      .cell-orange { fill:#ff9900; filter:url(#soft-glow); }
      .scan {
        animation: scan 2.35s cubic-bezier(.4,0,.2,1) forwards;
        transform-origin: left;
      }
      .status { animation: status-in .5s ease-out 2.15s both; }
      @keyframes assemble {
        0% { opacity:0; }
        45% { opacity:1; }
        78% { transform:translate(0,0) rotate(4deg) scale(1.08); }
        100% { opacity:1; transform:translate(0,0) rotate(0) scale(1); }
      }
      @keyframes scan {
        0% { transform:translateX(-1080px); opacity:0; }
        12% { opacity:.7; }
        88% { opacity:.7; }
        100% { transform:translateX(1080px); opacity:0; }
      }
      @keyframes status-in {
        from { opacity:0; transform:translateY(5px); }
        to { opacity:1; transform:translateY(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        .piece,.status { animation:none; opacity:1; transform:none; }
        .scan { display:none; }
      }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="308" rx="22" fill="url(#panel)" stroke="#30363d" stroke-width="2" />
  <text x="54" y="38" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="700" letter-spacing="2.4">CONTRIBUTION GRAPH</text>
  <text x="1146" y="38" text-anchor="end" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13">AWS · BUILT FROM CONTRIBUTIONS</text>

