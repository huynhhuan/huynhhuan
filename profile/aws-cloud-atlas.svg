<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc">
  <title id="title">AWS logo assembled from GitHub contribution cells</title>
  <desc id="desc">Contribution cells orbit with individual rotations in a five-second loop, assembling the AWS wordmark and smile.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a" />
      <stop offset="0.55" stop-color="#111827" />
      <stop offset="1" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0" />
      <stop offset="0.5" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="1" stop-color="#ef4444" stop-opacity="0" />
    </linearGradient>
    <filter id="soft-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <g id="week" fill="#1e293b">
      <rect y="0" width="14" height="14" rx="3" />
      <rect y="21" width="14" height="14" rx="3" />
      <rect y="42" width="14" height="14" rx="3" />
      <rect y="63" width="14" height="14" rx="3" />
      <rect y="84" width="14" height="14" rx="3" />
      <rect y="105" width="14" height="14" rx="3" />
      <rect y="126" width="14" height="14" rx="3" />
    </g>
    <style>
      .piece {
        opacity:.08;
        transform-box:view-box;
        transform-origin:50% 50%;
        animation-name:contribution-orbit;
        animation-duration:5s;
        animation-timing-function:cubic-bezier(.16,1,.3,1);
        animation-iteration-count:infinite;
      }
      .cell-blue { --end:#f59e0b; fill:#f59e0b; }
      .cell-light { --end:#fb923c; fill:#fb923c; }
      .cell-white { --end:#fbbf24; fill:#fbbf24; }
      .cell-orange { --end:#ef4444; fill:#ef4444; filter:url(#soft-glow); }
      .scan {
        animation:scan 5s cubic-bezier(.16,1,.3,1) infinite;
        transform-origin:left;
      }
      @keyframes contribution-orbit {
        0% { opacity:.08; transform:rotate(var(--spin)) scale(.28); fill:#1e293b; }
        18% { opacity:.72; }
        60% { opacity:1; transform:rotate(0deg) scale(1); fill:var(--end); }
        100% { opacity:1; transform:rotate(0deg) scale(1); fill:var(--end); }
      }
      @keyframes scan {
        0% { transform:translateX(-1080px); opacity:0; }
        10% { opacity:.7; }
        60% { transform:translateX(1080px); opacity:.5; }
        61%,100% { transform:translateX(1080px); opacity:0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .piece { animation:none; opacity:1; transform:none; fill:var(--end); }
        .scan { display:none; }
      }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="308" rx="22" fill="url(#panel)" stroke="#f59e0b" stroke-opacity=".28" stroke-width="2" />
  <text x="54" y="38" fill="#f59e0b" font-family="'JetBrains Mono',Consolas,'Courier New',monospace" font-size="13" font-weight="700" letter-spacing="2.4">CONTRIBUTION GRAPH</text>
  <text x="1146" y="38" text-anchor="end" fill="#e2e8f0" font-family="'JetBrains Mono',Consolas,'Courier New',monospace" font-size="13">AWS · BUILT FROM CONTRIBUTIONS</text>

