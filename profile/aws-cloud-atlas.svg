<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">AWS Cloud Atlas contribution artwork</title>
  <desc id="desc">An AWS wordmark sits at the center of a contribution-cell cloud connected to Infrastructure as Code, CI/CD, Amazon EKS, and observability nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#050b14"/>
      <stop offset=".55" stop-color="#0b1526"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop stop-color="#ff9900" stop-opacity=".23"/>
      <stop offset=".48" stop-color="#2f81f7" stop-opacity=".08"/>
      <stop offset="1" stop-color="#0b1526" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbit" x1="180" y1="100" x2="1020" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2f81f7"/>
      <stop offset=".45" stop-color="#ff9900"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <pattern id="contribution-grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <rect x="3" y="3" width="14" height="14" rx="3" fill="#334155" opacity=".34"/>
    </pattern>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <filter id="node-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .eyebrow{font:700 15px Inter,Segoe UI,sans-serif;letter-spacing:3px;fill:#8da2be}
      .headline{font:700 30px Inter,Segoe UI,sans-serif;fill:#f8fafc}
      .subhead{font:400 17px Inter,Segoe UI,sans-serif;fill:#9eafc7}
      .node-title{font:700 14px Inter,Segoe UI,sans-serif;letter-spacing:1.5px;fill:#f8fafc}
      .node-sub{font:500 13px Inter,Segoe UI,sans-serif;fill:#91a3ba}
      .micro{font:700 11px Inter,Segoe UI,sans-serif;letter-spacing:1.6px;fill:#71839c}
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="428" rx="26" fill="url(#bg)" stroke="#334155" stroke-width="2"/>
  <rect x="16" y="16" width="1168" height="398" rx="20" fill="url(#contribution-grid)" opacity=".7"/>
  <ellipse cx="600" cy="235" rx="455" ry="185" fill="url(#halo)"/>

  <text x="52" y="56" class="eyebrow">AWS CLOUD ATLAS</text>
  <text x="52" y="91" class="headline">Every contribution becomes part of the platform</text>
  <text x="52" y="119" class="subhead">Code, automation, infrastructure and signals orbit one reliable cloud.</text>

