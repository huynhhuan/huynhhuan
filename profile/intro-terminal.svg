<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="title desc">
  <title id="title">Hi, I'm Huỳnh Bá Huân</title>
  <desc id="desc">Backend and Web Developer, JavaScript, PHP, Python, DevOps and Cloud Operations, AWS, Terraform, and Kubernetes presented in sequence.</desc>
  <defs>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b" />
      <stop offset="0.55" stop-color="#fb923c" />
      <stop offset="1" stop-color="#ef4444" />
    </linearGradient>
    <filter id="soft-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <style>
      .title {
        font-family:'Plus Jakarta Sans','Segoe UI',Arial,sans-serif;
        font-size:64px;
        font-weight:800;
        letter-spacing:-1.6px;
      }
      .role {
        fill:url(#warm);
        font-family:'JetBrains Mono',Consolas,'Courier New',monospace;
        font-size:28px;
        font-weight:600;
      }
      .typed { clip-path:inset(0 100% 0 0); }
      .line-one { animation:type-one 13.5s steps(23,end) infinite; }
      .line-two { animation:type-two 13.5s steps(25,end) infinite; }
      .line-three { animation:type-three 13.5s steps(56,end) infinite; }
      .cursor-one { animation:travel-one 13.5s steps(23,end) infinite; }
      .cursor-two { animation:travel-two 13.5s steps(25,end) infinite; }
      .cursor-three { animation:travel-three 13.5s steps(56,end) infinite; }
      .cursor-blink { animation:blink .72s step-end infinite; }
      .static-role { display:none; }
      @keyframes type-one {
        0%,2% { clip-path:inset(0 100% 0 0); }
        20%,30% { clip-path:inset(0 0 0 0); }
        33%,100% { clip-path:inset(0 100% 0 0); }
      }
      @keyframes type-two {
        0%,34% { clip-path:inset(0 100% 0 0); }
        54%,63% { clip-path:inset(0 0 0 0); }
        66%,100% { clip-path:inset(0 100% 0 0); }
      }
      @keyframes type-three {
        0%,67% { clip-path:inset(0 100% 0 0); }
        88%,97% { clip-path:inset(0 0 0 0); }
        100% { clip-path:inset(0 100% 0 0); }
      }
      @keyframes travel-one {
        0%,2% { opacity:1; transform:translateX(0); }
        20%,30% { opacity:1; transform:translateX(398px); }
        33%,100% { opacity:0; transform:translateX(0); }
      }
      @keyframes travel-two {
        0%,34% { opacity:0; transform:translateX(0); }
        35% { opacity:1; transform:translateX(0); }
        54%,63% { opacity:1; transform:translateX(431px); }
        66%,100% { opacity:0; transform:translateX(0); }
      }
      @keyframes travel-three {
        0%,67% { opacity:0; transform:translateX(0); }
        68% { opacity:1; transform:translateX(0); }
        88%,97% { opacity:1; transform:translateX(954px); }
        100% { opacity:0; transform:translateX(0); }
      }
      @keyframes blink { 50% { opacity:0; } }
      @media (prefers-reduced-motion: reduce) {
        .animated-role { display:none; }
        .static-role { display:inline; }
      }
    </style>
  </defs>

  <text class="title" x="600" y="76" text-anchor="middle" fill="url(#warm)">Hi, I'm Huỳnh Bá Huân</text>
  <text x="965" y="76" font-family="'Segoe UI Emoji','Apple Color Emoji',sans-serif" font-size="48">👋</text>

  <g class="animated-role role">
    <text class="typed line-one" x="406" y="139">Backend &amp; Web Developer</text>
    <g class="cursor-one">
      <rect class="cursor-blink" x="408" y="116" width="3" height="29" rx="1.5" fill="#f59e0b" filter="url(#soft-glow)" />
    </g>

    <text class="typed line-two" x="389" y="139">JavaScript | PHP | Python</text>
    <g class="cursor-two">
      <rect class="cursor-blink" x="391" y="116" width="3" height="29" rx="1.5" fill="#fb923c" filter="url(#soft-glow)" />
    </g>

    <text class="typed line-three" x="128" y="139">DevOps / Cloud Operations | AWS | Terraform | Kubernetes</text>
    <g class="cursor-three">
      <rect class="cursor-blink" x="130" y="116" width="3" height="29" rx="1.5" fill="#ef4444" filter="url(#soft-glow)" />
    </g>
  </g>

  <text class="static-role role" x="600" y="139" text-anchor="middle">Backend &amp; Web Developer · DevOps / Cloud Operations</text>
  <rect x="350" y="170" width="500" height="3" rx="1.5" fill="url(#warm)" opacity=".82" />
</svg>
