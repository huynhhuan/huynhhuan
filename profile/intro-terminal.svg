<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="title desc">
  <title id="title">Hi, I'm Huỳnh Bá Huân</title>
  <desc id="desc">Web Developer and DevOps / Cloud Operations roles presented with a typing animation.</desc>
  <defs>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b" />
      <stop offset="0.55" stop-color="#fb923c" />
      <stop offset="1" stop-color="#ef4444" />
    </linearGradient>
    <filter id="soft-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <style>
      .title {
        font-family:'Plus Jakarta Sans','Segoe UI',Arial,sans-serif;
        font-size:64px;
        font-weight:800;
        letter-spacing:-1.6px;
      }
      .role {
        fill:url(#warm);
        font-family:'JetBrains Mono',Consolas,'Courier New',monospace;
        font-size:28px;
        font-weight:600;
      }
      .typed { clip-path:inset(0 100% 0 0); }
      .web-text { animation:type-web 10s steps(13,end) infinite; }
      .cloud-text { animation:type-cloud 10s steps(24,end) infinite; }
      .web-cursor { animation:cursor-web 10s steps(13,end) infinite, blink .72s step-end infinite; }
      .cloud-cursor { animation:cursor-cloud 10s steps(24,end) infinite, blink .72s step-end infinite; }
      .static-role { display:none; }
      @keyframes type-web {
        0%,4% { clip-path:inset(0 100% 0 0); }
        28%,42% { clip-path:inset(0 0 0 0); }
        47%,100% { clip-path:inset(0 100% 0 0); }
      }
      @keyframes type-cloud {
        0%,50% { clip-path:inset(0 100% 0 0); }
        78%,94% { clip-path:inset(0 0 0 0); }
        100% { clip-path:inset(0 100% 0 0); }
      }
      @keyframes cursor-web {
        0%,4% { opacity:1; transform:translateX(0); }
        28%,42% { opacity:1; transform:translateX(222px); }
        47%,100% { opacity:0; transform:translateX(0); }
      }
      @keyframes cursor-cloud {
        0%,50% { opacity:0; transform:translateX(0); }
        51% { opacity:1; transform:translateX(0); }
        78%,94% { opacity:1; transform:translateX(408px); }
        100% { opacity:0; transform:translateX(0); }
      }
      @keyframes blink { 50% { opacity:0; } }
      @media (prefers-reduced-motion: reduce) {
        .animated-role { display:none; }
        .static-role { display:inline; }
      }
    </style>
  </defs>

  <text class="title" x="600" y="76" text-anchor="middle" fill="url(#warm)">Hi, I'm Huỳnh Bá Huân</text>
  <text x="965" y="76" font-family="'Segoe UI Emoji','Apple Color Emoji',sans-serif" font-size="48">👋</text>

  <g class="animated-role role">
    <text class="typed web-text" x="486" y="139">Web Developer</text>
    <rect class="web-cursor" x="488" y="116" width="3" height="29" rx="1.5" fill="#f59e0b" filter="url(#soft-glow)" />

    <text class="typed cloud-text" x="393" y="139">DevOps / Cloud Operations</text>
    <rect class="cloud-cursor" x="395" y="116" width="3" height="29" rx="1.5" fill="#ef4444" filter="url(#soft-glow)" />
  </g>

  <text class="static-role role" x="600" y="139" text-anchor="middle">Web Developer · DevOps / Cloud Operations</text>
  <rect x="350" y="170" width="500" height="3" rx="1.5" fill="url(#warm)" opacity=".82" />
</svg>
