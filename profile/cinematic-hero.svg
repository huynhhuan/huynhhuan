<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Huỳnh Bá Huân — From Code to Cloud</title>
  <desc id="desc">A cinematic engineering title sequence for a Backend and Web Developer focused on DevOps and Cloud Operations.</desc>
  <defs>
    <linearGradient id="scene" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#020617"/>
      <stop offset="0.46" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="warm-title" x1="92" y1="0" x2="700" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f59e0b"/>
      <stop offset="0.55" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="pipeline" x1="100" y1="0" x2="1100" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3b82f6"/>
      <stop offset="0.45" stop-color="#60a5fa"/>
      <stop offset="0.68" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <radialGradient id="amber-light" cx="0" cy="0" r="1" gradientTransform="translate(1018 112) rotate(140) scale(470 330)">
      <stop stop-color="#f59e0b" stop-opacity=".28"/>
      <stop offset=".5" stop-color="#fb923c" stop-opacity=".08"/>
      <stop offset="1" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blue-light" cx="0" cy="0" r="1" gradientTransform="translate(87 446) rotate(-30) scale(520 310)">
      <stop stop-color="#3b82f6" stop-opacity=".24"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core-fill" cx="50%" cy="42%" r="62%">
      <stop stop-color="#1e3a5f"/>
      <stop offset=".72" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#020617"/>
    </radialGradient>
    <pattern id="micro-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#94a3b8" stroke-opacity=".07"/>
      <circle cx="1" cy="1" r="1" fill="#94a3b8" opacity=".14"/>
    </pattern>
    <filter id="orange-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blue-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity=".58"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="2" seed="18" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="faded"><feFuncA type="table" tableValues="0 .055"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faded" mode="screen"/>
    </filter>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="518" rx="22"/></clipPath>
    <style>
      .sans{font-family:'Plus Jakarta Sans','Segoe UI',Arial,sans-serif}
      .mono{font-family:'JetBrains Mono',Consolas,monospace}
      .intro,.title-one,.title-two,.role,.logline,.sequence,.core,.core-lines,.light-sweep{opacity:0}
      .intro{animation:rise .75s cubic-bezier(.16,1,.3,1) .15s 1 both}
      .title-one{animation:rise .9s cubic-bezier(.16,1,.3,1) .62s 1 both}
      .title-two{animation:rise .95s cubic-bezier(.16,1,.3,1) .95s 1 both}
      .role{animation:rise .75s cubic-bezier(.16,1,.3,1) 1.5s 1 both}
      .logline{animation:rise .75s cubic-bezier(.16,1,.3,1) 1.8s 1 both}
      .sequence{animation:rise .8s cubic-bezier(.16,1,.3,1) 2.12s 1 both}
      .core{transform-box:fill-box;transform-origin:center;animation:core-in 1.2s cubic-bezier(.16,1,.3,1) .8s 1 both}
      .core-lines{animation:fade .9s ease-out 1.45s 1 both}
      .draw{stroke-dasharray:420;stroke-dashoffset:420;animation:draw 1.4s cubic-bezier(.16,1,.3,1) 1.25s 1 both}
      .light-sweep{animation:sweep 1.4s ease-out 1.25s 1 both}
      @keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
      @keyframes core-in{from{opacity:0;transform:scale(.72) rotate(-8deg)}to{opacity:1;transform:scale(1) rotate(0)}}
      @keyframes fade{from{opacity:0}to{opacity:1}}
      @keyframes draw{to{stroke-dashoffset:0}}
      @keyframes sweep{0%{opacity:0;transform:translateX(-360px) skewX(-18deg)}25%{opacity:.9}100%{opacity:0;transform:translateX(760px) skewX(-18deg)}}
      @media (prefers-reduced-motion:reduce){.intro,.title-one,.title-two,.role,.logline,.sequence,.core,.core-lines,.light-sweep{animation:none;opacity:1}.core{transform:none}.draw{animation:none;stroke-dashoffset:0}}
    </style>
  </defs>

  <g clip-path="url(#frame)" filter="url(#grain)">
    <rect width="1200" height="520" fill="url(#scene)"/>
    <rect width="1200" height="520" fill="url(#micro-grid)"/>
    <rect width="1200" height="520" fill="url(#amber-light)"/>
    <rect width="1200" height="520" fill="url(#blue-light)"/>

    <g opacity=".28" fill="none" stroke="#3b82f6" stroke-width="1.4">
      <path d="M-80 470 600 250 1280 470"/>
      <path d="M72 520 600 250 1128 520"/>
      <path d="M246 520 600 250 954 520"/>
      <path d="M414 520 600 250 786 520"/>
      <path d="M-50 450H1250M58 410H1142M158 372H1042M258 336H942" opacity=".55"/>
    </g>

    <g opacity=".34" fill="#0b1323" stroke="#334155">
      <path d="M0 455h64v-52h38v52h58v-89h46v89h54v-58h52v58h62v-112h43v112h69v-67h45v67Z"/>
      <path d="M1200 455h-68v-73h-42v73h-58v-108h-48v108h-66v-61h-46v61h-74v-94h-44v94h-72v-49h-46v49Z"/>
    </g>

    <g class="core-lines" fill="none" stroke-linecap="round">
      <path class="draw" d="M706 275C784 194 827 194 884 215" stroke="#3b82f6" stroke-width="2"/>
      <path class="draw" d="M708 308C795 342 856 337 912 298" stroke="#f59e0b" stroke-width="2"/>
      <path class="draw" d="M1000 214c61-21 106-3 145 33" stroke="#22c55e" stroke-width="2"/>
      <path class="draw" d="M1015 302c59 26 91 22 132-3" stroke="#fb923c" stroke-width="2"/>
    </g>

    <g class="core" filter="url(#soft-shadow)">
      <circle cx="938" cy="260" r="130" fill="url(#core-fill)" stroke="#475569" stroke-width="2"/>
      <circle cx="938" cy="260" r="104" fill="none" stroke="#3b82f6" stroke-opacity=".42" stroke-width="2" stroke-dasharray="4 10"/>
      <circle cx="938" cy="260" r="74" fill="#0f172a" stroke="#f59e0b" stroke-width="2.5"/>
      <path d="M896 280h88c18 0 31-12 31-28 0-15-11-27-26-29-6-25-27-42-52-42-27 0-49 20-53 46-15 3-26 14-26 27 0 15 14 26 38 26Z" fill="#111827" stroke="url(#pipeline)" stroke-width="3"/>
      <g transform="translate(914 225)" fill="none" stroke="#e2e8f0" stroke-width="3" stroke-linejoin="round">
        <path d="m24 0 22 12v24L24 48 2 36V12L24 0Z"/><path d="M24 0v48M2 12l22 13 22-13M2 36l22-11 22 11"/>
      </g>
      <g filter="url(#orange-glow)"><circle cx="938" cy="156" r="5" fill="#f59e0b"/><circle cx="1041" cy="246" r="5" fill="#fb923c"/></g>
      <g filter="url(#blue-glow)"><circle cx="844" cy="218" r="5" fill="#3b82f6"/><circle cx="1002" cy="342" r="5" fill="#22c55e"/></g>
      <text x="938" y="370" text-anchor="middle" class="mono" font-size="12" font-weight="700" letter-spacing="2.4" fill="#94a3b8">CLOUD RUNTIME</text>
    </g>

    <g opacity=".8">
      <g transform="translate(1080 180)"><rect width="62" height="44" rx="9" fill="#111827" stroke="#22c55e"/><path d="M15 29l10-11 8 7 14-16" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/><circle cx="25" cy="18" r="2" fill="#22c55e"/><circle cx="33" cy="25" r="2" fill="#22c55e"/></g>
      <g transform="translate(1082 328)"><rect width="60" height="44" rx="9" fill="#111827" stroke="#fb923c"/><path d="M15 13h30M37 7l8 6-8 6M45 31H15M23 25l-8 6 8 6" fill="none" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>
      <g transform="translate(774 122)"><rect width="60" height="44" rx="9" fill="#111827" stroke="#3b82f6"/><path d="m30 7 18 10-18 10-18-10L30 7ZM12 27l18 10 18-10" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linejoin="round"/></g>
    </g>

    <g class="intro">
      <rect x="92" y="72" width="44" height="3" rx="1.5" fill="url(#warm-title)"/>
      <text x="148" y="81" class="mono" font-size="14" font-weight="700" letter-spacing="3.2" fill="#cbd5e1">HUỲNH BÁ HUÂN</text>
      <text x="92" y="112" class="mono" font-size="11" font-weight="700" letter-spacing="2.6" fill="#64748b">AN ENGINEERING PROFILE</text>
    </g>

    <text x="88" y="221" class="sans title-one" font-size="80" font-weight="800" letter-spacing="-3" fill="#f8fafc">FROM CODE</text>
    <text x="88" y="321" class="sans title-two" font-size="106" font-weight="800" letter-spacing="-5" fill="url(#warm-title)">TO CLOUD</text>

    <g class="light-sweep">
      <path d="M80 122h80l150 260h-82Z" fill="#fff" opacity=".1"/>
    </g>

    <text x="94" y="365" class="mono role" font-size="17" font-weight="700" letter-spacing="2.2" fill="#93c5fd">BACKEND &amp; WEB DEVELOPMENT  ·  DEVOPS &amp; CLOUD OPERATIONS</text>
    <text x="94" y="398" class="sans logline" font-size="18" font-weight="500" fill="#cbd5e1">Building practical systems — then making them secure, observable, and ready to scale.</text>

    <g class="sequence">
      <path d="M94 446H664" stroke="#334155" stroke-width="2"/>
      <path d="M94 446H664" stroke="url(#pipeline)" stroke-width="3" stroke-dasharray="82 24"/>
      <g class="mono" font-size="11" font-weight="700" letter-spacing="1.8">
        <text x="94" y="470" fill="#60a5fa">01  BUILD</text>
        <text x="246" y="470" fill="#93c5fd">02  AUTOMATE</text>
        <text x="430" y="470" fill="#f59e0b">03  DEPLOY</text>
        <text x="572" y="470" fill="#4ade80">04  OBSERVE</text>
      </g>
    </g>

    <rect x="0" y="0" width="1200" height="22" fill="#020308"/>
    <rect x="0" y="498" width="1200" height="22" fill="#020308"/>
    <path d="M0 22H1200M0 498H1200" stroke="#f59e0b" stroke-opacity=".28"/>
  </g>
  <rect x="1" y="1" width="1198" height="518" rx="22" fill="none" stroke="#334155" stroke-width="2"/>
</svg>
