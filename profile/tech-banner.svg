<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="title desc">
  <title id="title">From code to cloud</title>
  <desc id="desc">A visual delivery pipeline moving from application code through build and deployment to observability.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f" />
      <stop offset="0.55" stop-color="#0f2342" />
      <stop offset="1" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" />
      <stop offset="0.5" stop-color="#818cf8" />
      <stop offset="1" stop-color="#c084fc" />
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#93c5fd" stroke-opacity="0.07" />
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa" />
    </marker>
  </defs>

  <rect width="1000" height="260" rx="24" fill="url(#background)" />
  <rect width="1000" height="260" rx="24" fill="url(#grid)" />
  <circle cx="80" cy="30" r="90" fill="#0ea5e9" opacity="0.08" />
  <circle cx="930" cy="235" r="120" fill="#a855f7" opacity="0.08" />

  <text x="50" y="48" fill="#bfdbfe" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="4">FROM CODE TO CLOUD</text>
  <rect x="50" y="63" width="900" height="2" rx="1" fill="url(#accent)" opacity="0.7" />

  <path d="M220 135 H315 M455 135 H550 M690 135 H785" fill="none" stroke="#60a5fa" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)" opacity="0.8" />

  <g transform="translate(145 135)">
    <circle r="58" fill="#0b1f35" stroke="#38bdf8" stroke-width="3" filter="url(#glow)" />
    <path d="M-25 -14 L-43 0 L-25 14 M25 -14 L43 0 L25 14 M10 -28 L-10 28" fill="none" stroke="#7dd3fc" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <text y="88" text-anchor="middle" fill="#e0f2fe" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">DEVELOP</text>
    <text y="109" text-anchor="middle" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="12">JS · PHP · PYTHON</text>
  </g>

  <g transform="translate(380 135)">
    <circle r="58" fill="#111d3c" stroke="#818cf8" stroke-width="3" filter="url(#glow)" />
    <path d="M0 -34 L34 -16 L34 20 L0 38 L-34 20 L-34 -16 Z M0 -34 V2 M34 -16 L0 2 L-34 -16 M0 2 V38" fill="none" stroke="#a5b4fc" stroke-width="5" stroke-linejoin="round" />
    <text y="88" text-anchor="middle" fill="#eef2ff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">BUILD</text>
    <text y="109" text-anchor="middle" fill="#a5b4fc" font-family="Segoe UI, Arial, sans-serif" font-size="12">CI/CD · DOCKER</text>
  </g>

  <g transform="translate(615 135)">
    <circle r="58" fill="#17183d" stroke="#a78bfa" stroke-width="3" filter="url(#glow)" />
    <path d="M-37 19 H31 C44 19 48 0 36 -8 C34 -28 8 -37 -7 -24 C-27 -31 -43 -12 -36 4 C-49 10 -46 19 -37 19 Z" fill="none" stroke="#c4b5fd" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M-18 3 L-2 18 L23 -12" fill="none" stroke="#86efac" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <text y="88" text-anchor="middle" fill="#f5f3ff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">DEPLOY</text>
    <text y="109" text-anchor="middle" fill="#c4b5fd" font-family="Segoe UI, Arial, sans-serif" font-size="12">AWS · KUBERNETES</text>
  </g>

  <g transform="translate(850 135)">
    <circle r="58" fill="#20183e" stroke="#c084fc" stroke-width="3" filter="url(#glow)" />
    <path d="M-36 28 V-26 M-36 28 H38" fill="none" stroke="#e9d5ff" stroke-width="5" stroke-linecap="round" />
    <path d="M-28 13 L-10 -3 L7 7 L31 -22" fill="none" stroke="#f0abfc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="-28" cy="13" r="4" fill="#f0abfc" /><circle cx="-10" cy="-3" r="4" fill="#f0abfc" /><circle cx="7" cy="7" r="4" fill="#f0abfc" /><circle cx="31" cy="-22" r="4" fill="#f0abfc" />
    <text y="88" text-anchor="middle" fill="#faf5ff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">OBSERVE</text>
    <text y="109" text-anchor="middle" fill="#e9d5ff" font-family="Segoe UI, Arial, sans-serif" font-size="12">PROMETHEUS · GRAFANA</text>
  </g>
</svg>
