<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Selected engineering projects</title>
  <desc id="desc">Four project cards connect web engineering, cloud delivery, governance, and observability.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111c31"/>
    </linearGradient>
    <radialGradient id="blue-glow" cx="0" cy="0" r="1" gradientTransform="translate(170 70) rotate(35) scale(420 240)">
      <stop stop-color="#2f81f7" stop-opacity=".22"/>
      <stop offset="1" stop-color="#2f81f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orange-glow" cx="0" cy="0" r="1" gradientTransform="translate(1050 420) rotate(-150) scale(460 260)">
      <stop stop-color="#ff9900" stop-opacity=".2"/>
      <stop offset="1" stop-color="#ff9900" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flow" x1="80" y1="0" x2="1120" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2f81f7"/>
      <stop offset=".34" stop-color="#22c55e"/>
      <stop offset=".68" stop-color="#ff9900"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity=".48"/>
    </filter>
    <style>
      .eyebrow{font:700 15px Inter,Segoe UI,sans-serif;letter-spacing:3px;fill:#8da2be}
      .headline{font:700 30px Inter,Segoe UI,sans-serif;fill:#f8fafc}
      .subhead{font:400 17px Inter,Segoe UI,sans-serif;fill:#aab8cc}
      .tag{font:700 13px Inter,Segoe UI,sans-serif;letter-spacing:1.6px}
      .project{font:700 25px Inter,Segoe UI,sans-serif;fill:#f8fafc}
      .summary{font:400 16px Inter,Segoe UI,sans-serif;fill:#b9c6d8}
      .stack{font:600 14px Inter,Segoe UI,sans-serif;fill:#dce6f5}
      .step{font:700 12px Inter,Segoe UI,sans-serif;letter-spacing:1.4px;fill:#8294ad}
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="478" rx="26" fill="url(#canvas)" stroke="#334155" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="478" rx="26" fill="url(#blue-glow)"/>
  <rect x="1" y="1" width="1198" height="478" rx="26" fill="url(#orange-glow)"/>

  <g opacity=".12" fill="#8da2be">
    <circle cx="52" cy="44" r="3"/><circle cx="76" cy="44" r="3"/><circle cx="100" cy="44" r="3"/>
    <circle cx="1100" cy="438" r="3"/><circle cx="1124" cy="438" r="3"/><circle cx="1148" cy="438" r="3"/>
  </g>

  <text x="54" y="56" class="eyebrow">SELECTED SYSTEMS</text>
  <text x="54" y="91" class="headline">One engineering path, four practical builds</text>
  <text x="54" y="119" class="subhead">Application logic → delivery automation → cloud governance → observability</text>

  <path d="M118 155H1082" fill="none" stroke="#26364d" stroke-width="2"/>
  <path d="M118 155H1082" fill="none" stroke="url(#flow)" stroke-width="4" stroke-linecap="round" stroke-dasharray="64 22" opacity=".9"/>
  <g>
    <circle cx="118" cy="155" r="8" fill="#2f81f7"/><circle cx="439" cy="155" r="8" fill="#22c55e"/>
    <circle cx="761" cy="155" r="8" fill="#ff9900"/><circle cx="1082" cy="155" r="8" fill="#a78bfa"/>
  </g>
  <g text-anchor="middle">
    <text x="118" y="177" class="step">BUILD</text><text x="439" y="177" class="step">SHIP</text>
    <text x="761" y="177" class="step">GOVERN</text><text x="1082" y="177" class="step">OBSERVE</text>
  </g>

  <g filter="url(#shadow)">
    <g transform="translate(42 206)">
      <rect width="266" height="218" rx="20" fill="#111d30" stroke="#2f81f7" stroke-opacity=".72"/>
      <rect x="20" y="20" width="78" height="26" rx="13" fill="#102f58"/>
      <text x="59" y="38" class="tag" text-anchor="middle" fill="#79b8ff">WEB API</text>
      <g transform="translate(208 20)" fill="none" stroke="#79b8ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2L5 11l9 9M30 2l9 9-9 9M25 0l-7 22"/>
      </g>
      <text x="20" y="86" class="project">Badminton Shop</text>
      <text x="20" y="113" class="summary">Secure commerce API</text>
      <text x="20" y="137" class="summary">with VNPay checkout.</text>
      <rect x="20" y="166" width="87" height="30" rx="15" fill="#18283f"/><text x="64" y="186" class="stack" text-anchor="middle">Laravel</text>
      <rect x="116" y="166" width="75" height="30" rx="15" fill="#18283f"/><text x="153" y="186" class="stack" text-anchor="middle">MySQL</text>
    </g>

    <g transform="translate(325 206)">
      <rect width="266" height="218" rx="20" fill="#111d30" stroke="#22c55e" stroke-opacity=".72"/>
      <rect x="20" y="20" width="94" height="26" rx="13" fill="#123b2a"/>
      <text x="67" y="38" class="tag" text-anchor="middle" fill="#73df9e">FULL STACK</text>
      <g transform="translate(210 20)" fill="none" stroke="#73df9e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 5h6l3 14h24l4-10H11M17 25a3 3 0 1 0 0 .1M33 25a3 3 0 1 0 0 .1"/>
      </g>
      <text x="20" y="86" class="project">GreenCart</text>
      <text x="20" y="113" class="summary">Containerized MERN shop</text>
      <text x="20" y="137" class="summary">with cloud health signals.</text>
      <rect x="20" y="166" width="82" height="30" rx="15" fill="#18283f"/><text x="61" y="186" class="stack" text-anchor="middle">Node.js</text>
      <rect x="111" y="166" width="78" height="30" rx="15" fill="#18283f"/><text x="150" y="186" class="stack" text-anchor="middle">React</text>
    </g>

    <g transform="translate(608 206)">
      <rect width="266" height="218" rx="20" fill="#111d30" stroke="#ff9900" stroke-opacity=".78"/>
      <rect x="20" y="20" width="104" height="26" rx="13" fill="#4a2b07"/>
      <text x="72" y="38" class="tag" text-anchor="middle" fill="#ffbd63">CLOUD OPS</text>
      <g transform="translate(206 18)" fill="none" stroke="#ffbd63" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 27h29a9 9 0 0 0 1-18 14 14 0 0 0-27-1A10 10 0 0 0 8 27Z"/>
      </g>
      <text x="20" y="86" class="project">AWS Accelerator</text>
      <text x="20" y="113" class="summary">Infrastructure-to-GitOps</text>
      <text x="20" y="137" class="summary">delivery platform.</text>
      <rect x="20" y="166" width="96" height="30" rx="15" fill="#18283f"/><text x="68" y="186" class="stack" text-anchor="middle">Terraform</text>
      <rect x="125" y="166" width="102" height="30" rx="15" fill="#18283f"/><text x="176" y="186" class="stack" text-anchor="middle">Kubernetes</text>
    </g>

    <g transform="translate(891 206)">
      <rect width="266" height="218" rx="20" fill="#111d30" stroke="#a78bfa" stroke-opacity=".78"/>
      <rect x="20" y="20" width="112" height="26" rx="13" fill="#30245b"/>
      <text x="76" y="38" class="tag" text-anchor="middle" fill="#c4b5fd">GOVERNANCE</text>
      <g transform="translate(211 18)" fill="none" stroke="#c4b5fd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 2 35 8v11c0 10-7 16-15 20C12 35 5 29 5 19V8L20 2Z"/><path d="m13 20 5 5 10-11"/>
      </g>
      <text x="20" y="86" class="project">EKS Governance</text>
      <text x="20" y="113" class="summary">Audit-ready controls for</text>
      <text x="20" y="137" class="summary">a Kubernetes platform.</text>
      <rect x="20" y="166" width="96" height="30" rx="15" fill="#18283f"/><text x="68" y="186" class="stack" text-anchor="middle">CloudTrail</text>
      <rect x="125" y="166" width="76" height="30" rx="15" fill="#18283f"/><text x="163" y="186" class="stack" text-anchor="middle">AWS Config</text>
    </g>
  </g>
</svg>
