<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">Huỳnh Bá Huân — Cloud Control Room</title>
  <desc id="desc">A dark cinematic identity console presenting Huỳnh Bá Huân as a DevOps, Cloud Operations and Web Developer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030712" />
      <stop offset="0.58" stop-color="#0A1630" />
      <stop offset="1" stop-color="#11102D" />
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8" />
      <stop offset="0.52" stop-color="#818CF8" />
      <stop offset="1" stop-color="#F59E0B" />
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.22" />
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#93C5FD" stroke-opacity="0.055" />
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b" />
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="998" height="298" rx="24" fill="url(#bg)" stroke="#334155" stroke-width="2" />
  <rect x="1" y="1" width="998" height="298" rx="24" fill="url(#grid)" />
  <circle cx="825" cy="145" r="205" fill="url(#halo)" />
  <path d="M24 8H976" stroke="url(#line)" stroke-width="5" stroke-linecap="round" />

  <circle cx="43" cy="33" r="5" fill="#22C55E" />
  <circle cx="61" cy="33" r="5" fill="#38BDF8" />
  <circle cx="79" cy="33" r="5" fill="#F59E0B" />
  <text x="101" y="39" fill="#94A3B8" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="700" letter-spacing="2">HBH / CLOUD CONTROL ROOM</text>

  <text x="52" y="105" fill="#F8FAFC" font-family="'Segoe UI', Arial, sans-serif" font-size="43" font-weight="750" letter-spacing="1">HUỲNH BÁ HUÂN</text>
  <text x="54" y="139" fill="#7DD3FC" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="700" letter-spacing="2">DEVOPS · CLOUD OPERATIONS · WEB DEVELOPMENT</text>
  <path d="M54 160H590" stroke="#334155" stroke-width="1.5" />
  <text x="54" y="188" fill="#94A3B8" font-family="'Segoe UI', Arial, sans-serif" font-size="15">Building reliable paths from source code to observable cloud systems.</text>

  <g font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="700" letter-spacing="1">
    <rect x="54" y="215" width="157" height="38" rx="19" fill="#0B2035" stroke="#0EA5E9" />
    <circle cx="75" cy="234" r="5" fill="#38BDF8" />
    <text x="89" y="239" fill="#E0F2FE">DEVOPS</text>
    <rect x="224" y="215" width="185" height="38" rx="19" fill="#151B3F" stroke="#6366F1" />
    <circle cx="245" cy="234" r="5" fill="#818CF8" />
    <text x="259" y="239" fill="#E0E7FF">CLOUD OPS</text>
    <rect x="422" y="215" width="168" height="38" rx="19" fill="#291A24" stroke="#D97706" />
    <circle cx="443" cy="234" r="5" fill="#F59E0B" />
    <text x="457" y="239" fill="#FEF3C7">WEB DEV</text>
  </g>

  <g transform="translate(650 49)">
    <rect width="300" height="204" rx="18" fill="#071226" fill-opacity="0.88" stroke="#334155" />
    <text x="22" y="31" fill="#CBD5E1" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="700" letter-spacing="2">SYSTEM MAP</text>
    <circle cx="261" cy="27" r="5" fill="#22C55E" filter="url(#glow)" />
    <text x="244" y="188" fill="#86EFAC" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="12">ONLINE</text>

    <ellipse cx="150" cy="112" rx="96" ry="61" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="5 7" />
    <ellipse cx="150" cy="112" rx="70" ry="91" fill="none" stroke="#1D4ED8" stroke-opacity="0.38" />
    <path d="M150 112L67 83M150 112L232 75M150 112L237 150M150 112L82 166" stroke="#475569" stroke-width="2" />

    <circle cx="150" cy="112" r="32" fill="#102444" stroke="#38BDF8" stroke-width="2.5" filter="url(#glow)" />
    <text x="150" y="118" fill="#F8FAFC" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="16" font-weight="700">HBH</text>

    <g font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="700">
      <circle cx="67" cy="83" r="13" fill="#0B2035" stroke="#38BDF8" stroke-width="2" /><text x="67" y="87" fill="#BAE6FD" text-anchor="middle">WEB</text>
      <circle cx="232" cy="75" r="13" fill="#151B3F" stroke="#818CF8" stroke-width="2" /><text x="232" y="79" fill="#C7D2FE" text-anchor="middle">CI</text>
      <circle cx="237" cy="150" r="13" fill="#2B1B21" stroke="#F59E0B" stroke-width="2" /><text x="237" y="154" fill="#FDE68A" text-anchor="middle">AWS</text>
      <circle cx="82" cy="166" r="13" fill="#10271F" stroke="#22C55E" stroke-width="2" /><text x="82" y="170" fill="#BBF7D0" text-anchor="middle">OPS</text>
    </g>
  </g>
</svg>
