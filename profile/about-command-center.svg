<svg xmlns="http://www.w3.org/2000/svg" width="823" height="250" viewBox="0 0 823 250" role="img" aria-labelledby="title desc">
  <title id="title">Huynh Ba Huan engineering command center</title>
  <desc id="desc">An animated terminal and delivery path connecting code, pipeline, cloud, and observability.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset=".5" stop-color="#F97316"/>
      <stop offset="1" stop-color="#EF4444"/>
    </linearGradient>
    <filter id="soft-glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono{font-family:'Fira Code','JetBrains Mono',Consolas,monospace}
      .frame{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
      .panel{fill:#f6f8fa;stroke:#d8dee4;stroke-width:1}
      .rule{stroke:#d0d7de;stroke-width:1}
      .muted{fill:#656d76}
      .primary{fill:#24292f}
      .brand-text{fill:#f97316}
      .tiny{font-size:8px;font-weight:700;letter-spacing:1.2px}
      .small{font-size:9px;font-weight:650}
      .body{font-size:10px;font-weight:650}
      .terminal-title{font-size:8px;font-weight:750;letter-spacing:1.1px}
      .prompt{fill:#ef4444;font-size:10px;font-weight:800}
      .answer{fill:#24292f;font-size:10px;font-weight:650}
      .cursor{fill:#f97316;animation:blink 1s steps(1,end) infinite}
      @keyframes blink{0%,48%{opacity:1}49%,100%{opacity:0}}
      .rail{stroke:#d0d7de;stroke-width:2;stroke-linecap:round}
      .flow{stroke:url(#brand);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:330;stroke-dashoffset:330;animation:flow 8s cubic-bezier(.2,.72,.2,1) infinite}
      @keyframes flow{0%,5%{stroke-dashoffset:330;opacity:.2}68%,83%{stroke-dashoffset:0;opacity:1}94%,100%{stroke-dashoffset:-330;opacity:0}}
      .signal{fill:#f97316;filter:url(#soft-glow);animation:signal 8s cubic-bezier(.2,.72,.2,1) infinite}
      @keyframes signal{0%,5%{opacity:0;transform:translateX(0)}9%{opacity:1}72%,82%{opacity:1;transform:translateX(330px)}94%,100%{opacity:0;transform:translateX(330px)}}
      .stage{color:#8c959f;animation:stage 8s cubic-bezier(.18,.84,.2,1) infinite;animation-delay:calc(var(--i)*1.75s)}
      @keyframes stage{
        0%,4%,100%{color:#8c959f;transform:translateY(0)}
        9%{color:#f59e0b;transform:translateY(1px) scale(.97)}
        13%{color:#f97316;transform:translateY(-1px) scale(1.035)}
        20%,27%{color:#ef4444;transform:translateY(0) scale(1)}
        34%{color:#8c959f;transform:translateY(0)}
      }
      .node-bg{fill:currentColor;fill-opacity:.055;stroke:currentColor;stroke-opacity:.62;stroke-width:1.2}
      .node-icon{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
      .node-label{fill:currentColor;font-size:8px;font-weight:800;letter-spacing:.9px;text-anchor:middle}
      .status{fill:currentColor;transform-box:fill-box;transform-origin:center;animation:status 8s ease-in-out infinite;animation-delay:calc(var(--i)*1.75s)}
      @keyframes status{0%,6%,34%,100%{opacity:.28;transform:scale(.7)}11%,27%{opacity:1;transform:scale(1.25)}}
      .live-dot{animation:live-dot 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      @keyframes live-dot{0%,100%{opacity:.25;transform:scale(.82)}50%{opacity:1;transform:scale(1.12)}}
      .chip{fill:#f6f8fa;stroke:#d8dee4}
      .chip-dot{fill:url(#brand)}
      .chip-text{fill:#57606a;font-size:8px;font-weight:750;letter-spacing:.75px}
      @media(prefers-color-scheme:dark){
        .frame{fill:#0d1117;stroke:#30363d}
        .panel,.chip{fill:#161b22;stroke:#30363d}
        .rule,.rail{stroke:#30363d}
        .muted,.chip-text{fill:#8b949e}
        .primary,.answer{fill:#e6edf3}
      }
    </style>
  </defs>

  <rect class="frame" x=".5" y=".5" width="822" height="249" rx="14"/>

  <circle cx="18" cy="20" r="3.5" fill="#EF4444"/>
  <circle cx="30" cy="20" r="3.5" fill="#F59E0B"/>
  <circle cx="42" cy="20" r="3.5" fill="#3FB950"/>
  <text class="mono muted tiny" x="57" y="23">MORE / ABOUT / HUYNHHUAN</text>
  <line class="rule" x1="260" y1="19.5" x2="650" y2="19.5"/>
  <circle class="live-dot" cx="672" cy="19.5" r="3" fill="#F97316"/>
  <text class="mono brand-text tiny" x="804" y="23" text-anchor="end">STATUS / BUILDING</text>

  <g aria-label="Developer terminal">
    <rect class="panel" x="18" y="40" width="305" height="162" rx="10"/>
    <text class="mono muted terminal-title" x="32" y="58">TERMINAL / IDENTITY</text>
    <line class="rule" x1="32" y1="66" x2="309" y2="66"/>

    <text class="mono prompt" x="32" y="84">$</text>
    <text class="mono muted small" x="47" y="84">whoami</text>
    <text class="mono answer" x="47" y="99">Web Developer + DevOps / CloudOps</text>

    <text class="mono prompt" x="32" y="119">$</text>
    <text class="mono muted small" x="47" y="119">approach</text>
    <text class="mono answer" x="47" y="134">build -&gt; ship -&gt; observe</text>

    <text class="mono prompt" x="32" y="154">$</text>
    <text class="mono muted small" x="47" y="154">focus</text>
    <text class="mono answer" x="47" y="169">AWS / IaC / containers / delivery</text>

    <text class="mono prompt" x="32" y="189">$</text>
    <text class="mono muted small" x="47" y="189">Vietnam / UTC+7</text>
    <rect class="cursor" x="150" y="180" width="7" height="11" rx="1"/>
  </g>

  <g aria-label="Engineering delivery path">
    <rect class="panel" x="340" y="40" width="465" height="162" rx="10"/>
    <text class="mono muted terminal-title" x="355" y="58">DELIVERY PATH / CODE TO OPERATIONS</text>
    <line class="rule" x1="355" y1="66" x2="790" y2="66"/>

    <line class="rail" x1="399" y1="111" x2="729" y2="111"/>
    <line class="flow" x1="399" y1="111" x2="729" y2="111"/>
    <circle class="signal" cx="399" cy="111" r="4"/>

    <g class="stage" style="--i:0">
      <rect class="node-bg" x="356" y="76" width="86" height="72" rx="9"/>
      <path class="node-icon" d="M383 101l-8 8 8 8M415 101l8 8-8 8M406 96l-14 26"/>
      <circle class="status" cx="431" cy="87" r="3"/>
      <text class="mono node-label" x="399" y="139">CODE</text>
    </g>

    <g class="stage" style="--i:1">
      <rect class="node-bg" x="466" y="76" width="86" height="72" rx="9"/>
      <path class="node-icon" d="M488 100v17m0-10h14m0 0v-7m0 7v10m0-17h14m0 0v17"/>
      <circle class="node-icon" cx="488" cy="98" r="3"/>
      <circle class="node-icon" cx="502" cy="119" r="3"/>
      <circle class="node-icon" cx="516" cy="98" r="3"/>
      <circle class="status" cx="541" cy="87" r="3"/>
      <text class="mono node-label" x="509" y="139">PIPELINE</text>
    </g>

    <g class="stage" style="--i:2">
      <rect class="node-bg" x="576" y="76" width="86" height="72" rx="9"/>
      <path class="node-icon" d="M601 117h34a9 9 0 0 0 1-18 15 15 0 0 0-28-3 11 11 0 0 0-7 21Z"/>
      <circle class="status" cx="651" cy="87" r="3"/>
      <text class="mono node-label" x="619" y="139">CLOUD</text>
    </g>

    <g class="stage" style="--i:3">
      <rect class="node-bg" x="686" y="76" width="86" height="72" rx="9"/>
      <path class="node-icon" d="M706 120V99m10 21v-12m10 12V94m10 26v-17m-34 17h39"/>
      <circle class="status" cx="761" cy="87" r="3"/>
      <text class="mono node-label" x="729" y="139">OBSERVE</text>
    </g>

    <text class="mono muted small" x="355" y="176">application code</text>
    <text class="mono muted small" x="790" y="176" text-anchor="end">reliable production service</text>
    <path d="M456 173H689" stroke="url(#brand)" stroke-width="1.5" stroke-linecap="round" opacity=".7"/>
  </g>

  <g aria-label="Engineering principles">
    <rect class="chip" x="18" y="215" width="245" height="23" rx="11.5"/>
    <circle class="chip-dot" cx="33" cy="226.5" r="3"/>
    <text class="mono chip-text" x="44" y="229">AUTOMATE THE REPEATABLE</text>

    <rect class="chip" x="289" y="215" width="245" height="23" rx="11.5"/>
    <circle class="chip-dot" cx="304" cy="226.5" r="3"/>
    <text class="mono chip-text" x="315" y="229">SECURE THE DELIVERY PATH</text>

    <rect class="chip" x="560" y="215" width="245" height="23" rx="11.5"/>
    <circle class="chip-dot" cx="575" cy="226.5" r="3"/>
    <text class="mono chip-text" x="586" y="229">OBSERVE WHAT RUNS</text>
  </g>
</svg>
