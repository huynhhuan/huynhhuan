name: Refresh live delivery feed

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/update_live_feed.py
      - .github/workflows/update-live-feed.yml

permissions:
  contents: write

concurrency:
  group: refresh-live-delivery-feed
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Refresh GitHub activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
          PIPELINE_REPOSITORY: huynhhuan/bahuan-aws-accelerator-p2
        run: python3 scripts/update_live_feed.py

      - name: Commit feed changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "Refresh live delivery feed"
          git pull --rebase
          git push
